name: 持续集成校验

on: [push, pull_request]

jobs:
  check:
    name: 代码检查
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
      - name: 安装 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JS 语法校验
        run: |
          echo "===== 开始校验 JS 文件语法 ====="
          node --check index.js
          node --check client.js
          echo "✅ 语法校验通过！"
